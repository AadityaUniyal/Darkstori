name: CD

on:
  push:
    tags:
      - 'v*.*.*'  # Deploy only on version tags (e.g., v1.0.0, v1.2.3)
  workflow_dispatch:  # Allow manual deployment trigger

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Deploy backend to Railway/Render
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to Railway
        run: |
          echo "🚀 Backend deployment configured"
          echo "Add Railway CLI deployment here"
          echo "railway up --service backend"
        # Uncomment when Railway is configured:
        # - name: Install Railway CLI
        #   run: npm install -g @railway/cli
        # 
        # - name: Deploy to Railway
        #   env:
        #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        #   run: railway up --service backend

  # Deploy frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to Vercel
        run: |
          echo "🚀 Frontend deployment configured"
          echo "Add Vercel deployment here"
          echo "vercel --prod"
        # Uncomment when Vercel is configured:
        # - name: Install Vercel CLI
        #   run: npm install -g vercel
        # 
        # - name: Deploy to Vercel
        #   env:
        #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        #   run: |
        #     cd frontend
        #     vercel --prod --token=$VERCEL_TOKEN

  # Build and push Docker images to GHCR
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub release on tag
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
