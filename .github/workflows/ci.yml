name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitattributes'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/base.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy isort bandit
          pip install -r backend/requirements/base.txt || echo "Warning: Some dependencies may not install in CI"

      - name: Check code formatting with Black
        run: black --check backend/ || echo "Black formatting check failed - please run 'black backend/'"
        continue-on-error: true

      - name: Lint with flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 backend/ --count --max-complexity=10 --max-line-length=127 --statistics || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only backend/ || echo "Import sorting check failed - please run 'isort backend/'"
        continue-on-error: true

      - name: Type check with mypy
        run: mypy backend/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Security check with bandit
        run: bandit -r backend/ -ll
        continue-on-error: true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-python]

    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key-32chars-exactly-needed
      JWT_SECRET_KEY: ci-test-jwt-secret-32chars-exactly
      ALGORITHM: HS256
      JWT_ALGORITHM: HS256
      ENVIRONMENT: testing
      DEBUG: "False"
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_MAPS_API_KEY: test-key-placeholder
      GOOGLE_PLACES_API_KEY: test-key-placeholder
      GOOGLE_GEOCODING_API_KEY: test-key-placeholder
      GOOGLE_DISTANCE_MATRIX_API_KEY: test-key-placeholder
      KAGGLE_USERNAME: testuser
      KAGGLE_API_KEY: testkey
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_USER: test@test.com
      SMTP_PASSWORD: testpass
      ALERT_EMAIL: test@test.com
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      NEON_DATABASE_URL: sqlite:///./test.db
      MLFLOW_ENABLE_TRACKING: "False"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt -r backend/requirements/ml.txt

      - name: Run tests with pytest
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: |
          pytest tests/ -v --tb=short 2>&1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend, lint-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: darkstori-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: darkstori-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies for vulnerabilities
        run: safety check --file backend/requirements/base.txt --json
        continue-on-error: true

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r backend/ -f sarif -o bandit.sarif -ll
        continue-on-error: true

      - name: Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
        continue-on-error: true

  migration-check:
    name: Check Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-python]

    env:
      DATABASE_URL: sqlite:///./ci_migrations.db
      SECRET_KEY: ci-test-secret-key-32chars-exactly-needed
      JWT_SECRET_KEY: ci-test-jwt-secret-32chars-exactly
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/base.txt

      - name: Run migration check
        run: |
          alembic upgrade head
