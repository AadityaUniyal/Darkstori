name: Darkstori CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install basic tools
        pip install flake8 pytest
        # Install project requirements
        pip install -r backend/requirements/base.txt
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Test with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost:5432/dummy"
      run: |
        # We would run tests here if we had them. 
        # For now, we just verify the application can be imported.
        python -c "import backend.app"
