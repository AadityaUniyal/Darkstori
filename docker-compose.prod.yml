services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  backend:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-darkstori}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/darkstori_db
      - ENVIRONMENT=production
      - DEBUG=False
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    restart: unless-stopped
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    environment:
      - VITE_API_URL=${API_URL}
    restart: unless-stopped
