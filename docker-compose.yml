services:
  postgres:
    image: postgres:16-alpine
    container_name: darkstori-postgres
    environment:
      POSTGRES_USER: darkstori
      POSTGRES_PASSWORD: darkstori_dev_password
      POSTGRES_DB: darkstori_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstori"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - darkstori-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: darkstori-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://darkstori:darkstori_dev_password@postgres:5432/darkstori_db
      - ENVIRONMENT=development
      - DEBUG=True
      - SECRET_KEY=darkstore-dev-secret-key-min-32-chars-long
      - JWT_SECRET_KEY=darkstore-dev-secret-key-min-32-chars-long
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - SEED_DEMO_DATA=false
    ports:
      - "8000:8000"
    entrypoint: ["/app/docker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./frontend/nginx:/app/frontend/nginx
    networks:
      - darkstori-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: darkstori-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - darkstori-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: darkstori-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - darkstori-network

  grafana:
    image: grafana/grafana:10.1.5
    container_name: darkstori-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - darkstori-network


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: darkstori-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - darkstori-network

volumes:
  postgres_data:
  mlflow_data:

networks:
  darkstori-network:
    driver: bridge
